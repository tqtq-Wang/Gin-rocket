app:
  name: gin-rocket
  env: dev

server:
  host: 0.0.0.0
  port: 8080
  mode: release
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s

log:
  level: info
  format: json
  disable_stacktrace: false

auth:
  issuer: gin-rocket
  access_secret: please-change-access-secret
  refresh_secret: please-change-refresh-secret
  access_ttl: 2h
  refresh_ttl: 168h
  refresh_token_prefix: auth:refresh
  permission_cache_ttl: 5m

swagger:
  enabled: true
  route_prefix: /swagger
  title: Gin Rocket API
  description: Gin Rocket backend APIs
  version: 1.0.0
  server_url: ""

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  db_name: gin_rocket
  charset: utf8mb4
  parse_time: true
  loc: Local
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 30m
  conn_max_idle_time: 15m
  log_level: warn
  slow_threshold: 200ms

redis:
  addr: 127.0.0.1:6379
  username: ""
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

minio:
  enabled: false
  endpoint: 127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  use_ssl: false
  bucket: gin-rocket
  location: ap-east-1
  auto_create_bucket: true
  base_url: ""
  presign_expiry: 15m
